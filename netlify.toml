# Tells Netlify how to build the site.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Astro 7 needs Node.js 22.23 or newer; 24 is the current long-term version.
  NODE_VERSION = "24"

# Security headers sent with every page.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin"
    # Only load scripts, styles, fonts and images from this site itself.
    # (app.netlify.com is allowed for the "Powered by Netlify" badge.)
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://app.netlify.com; object-src 'none'; upgrade-insecure-requests"

# Fonts and built files never change names, so let browsers cache them.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
