<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="glow" cx="0.85" cy="0" r="0.9">
      <stop offset="0" stop-color="#5cd1c4" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#5cd1c4" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="#0b1625"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- wordmark -->
  <g transform="translate(80 86)">
    <rect x="0" y="0" width="44" height="44" rx="10" fill="none" stroke="#e7edf5" stroke-width="2.5"/>
    <rect x="9" y="9" width="11" height="11" rx="2.5" fill="#e7edf5" opacity="0.35"/>
    <rect x="24" y="9" width="11" height="11" rx="2.5" fill="#5cd1c4"/>
