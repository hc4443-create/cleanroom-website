    <text x="62" y="33" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="600" fill="#e7edf5">Cleanroom</text>
  </g>

  <!-- headline -->
  <text font-family="Georgia, 'Times New Roman', serif" font-size="62" fill="#ffffff">
    <tspan x="80" y="300">Private AI on the</tspan>
    <tspan x="80" y="378">GPU clusters you</tspan>
    <tspan x="80" y="456">already own.</tspan>
  </text>
  <text x="80" y="540" font-family="Helvetica, Arial, sans-serif" font-size="25" fill="#a7b4c6">No new hardware · No per-use cloud bills · Data stays on campus</text>

